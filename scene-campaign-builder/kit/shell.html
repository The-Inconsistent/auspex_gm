<button type="button" class="input select" aria-label="Exit scene"><span>04 · THE DEAL</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>

<!-- ROLL ON A BOOK TABLE (shared pattern: scene from an event table, NPC name/look, hazards, loot).
     Prep only: ROLL picks a row, I ROLLED takes a physical roll, or the GM taps a row. The picked row is iron. -->
<div style="border: 1px solid var(--line); background: var(--vellum)">
<div class="tbar"><span>[TABLE NAME]</span><span style="font-size: 11px">D66 · [BOOK] p.[N]</span></div>
<div class="thead" style="display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 5px 12px"><span>ROLL</span><span>RESULT</span></div>
<div class="zebra">
<button type="button" style="display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; width: 100%; min-height: 40px; padding: 6px 12px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; align-items: center"><span class="cz" style="font-weight: 700">11–16</span><span>[row]</span></button>
<button type="button" aria-pressed="true" style="display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; width: 100%; min-height: 40px; padding: 6px 12px; border: 0; background: var(--iron); color: var(--bone); font: inherit; text-align: left; align-items: center"><span class="cz" style="font-weight: 700">21–26</span><span>[picked row]</span></button>
</div>
<div class="keys" style="padding: 10px 12px; border-top: 1px solid var(--line)">
<button type="button" class="btn btn-p">ROLL</button>
<span class="lbl">OR</span>
<label class="lbl" for="rolled">I ROLLED</label><input id="rolled" class="input" inputmode="numeric" value="23" style="width: 80px">
<span class="hint">or tap a row</span>
<span style="flex-grow: 1"></span>
<span class="chip chip-warn">ROLLED 23</span>
<button type="button" class="btn">USE THIS</button>
</div>
</div>

<!-- ADD FROM BOOK / PICK FROM A CATALOGUE (shared pattern: factions, places, NPCs, wargear items, bestiary clones).
     Over the dimmed screen: search, source filter, a result list, the picked entry's preview, ADD. -->
<div style="position: absolute; inset: 0; background: rgba(21,17,14,.55); display: flex; justify-content: center; padding: 40px 0">
<div style="width: 900px; background: var(--vellum); border: 2px solid var(--iron); display: flex; flex-direction: column">
<div class="tbar iron"><span>ADD FROM BOOK · [KIND]</span><button type="button" class="btn sm" aria-label="Close" style="color: var(--bone); border-color: var(--bone2)">×</button></div>
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<input class="input" aria-label="Search" placeholder="Search by name">
<div class="keys" role="group" aria-label="Book"><button type="button" class="btn sm btn-p" aria-pressed="true">ALL BOOKS</button><button type="button" class="btn sm" aria-pressed="false">CORE RULEBOOK</button></div>
<div style="display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px">
<div class="zebra" style="border: 1px solid var(--line)">[result rows: name, leader, cite]</div>
<div style="display: flex; flex-direction: column; gap: 8px">[preview of the picked entry] <button type="button" class="btn btn-p">ADD TO CODEX</button></div>
</div>
</div>
</div>
</div>
