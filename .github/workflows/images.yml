# Publishes the api and web images. It does NOT deploy (the killteam-gm pattern).
#
# Dockhand git-pulls this repo and runs plain `docker compose up -d` on docker-compose.prod.yml, which only pulls
# finished images; the VPS never builds. So this workflow's whole job is to keep the two `:latest` images current. You
# then hit "Pull & redeploy" on the auspex stack in Dockhand. (killteam-gm tried a Pangolin tunnel + Dockhand webhook
# for automatic redeploys; the webhook answered 403 and it was deleted rather than debugged.)
#
# The images carry copyrighted book text (packages/data), so they stay PRIVATE: this repo is private, and GHCR
# packages pushed from it with GITHUB_TOKEN inherit that. Never make them public.
#
# One variable, in the `prod` environment: CLERK_PUBLISHABLE_KEY (the production pk_live_…). It is public by design, so
# a variable, not a secret.
name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # CLERK_PUBLISHABLE_KEY is a variable of the `prod` environment, visible only to jobs that name it.
    environment: prod
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The VPS is amd64 and so is the runner: no emulation needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # A single plain manifest. The default provenance attestation is stored as an *untagged* version that the
          # tag points at, and the prune step below would delete it, breaking `:latest`.
          provenance: false
          tags: ghcr.io/the-inconsistent/glory-gm-${{ matrix.app }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}

      # Each :latest push leaves the previous image behind untagged. Private GHCR storage has a small free quota, so
      # keep only what's tagged.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: glory-gm-${{ matrix.app }}
          package-type: container
          delete-only-untagged-versions: "true"

      - run: echo "Image pushed. Now hit **Pull & redeploy** on the auspex stack in Dockhand." >> $GITHUB_STEP_SUMMARY
